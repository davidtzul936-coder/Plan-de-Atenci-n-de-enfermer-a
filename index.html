<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Herramienta para Creación de Planes de Atención de Enfermería</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Inter', sans-serif; background: #f4f7fc; height: 100vh; display: flex; flex-direction: column; color: #1e293b; }
        
        header { background: #0f172a; color: white; padding: 1.5rem; text-align: center; }
        header h1 { font-size: 1.25rem; font-weight: 600; }
        
        nav { display: flex; justify-content: center; gap: 1rem; background: #ffffff; padding: 0.75rem; border-bottom: 1px solid #e2e8f0; }
        .nav-btn { padding: 0.6rem 1.2rem; border: none; background: #e2e8f0; border-radius: 6px; cursor: pointer; font-size: 0.9rem; font-weight: 600; transition: 0.2s; }
        .nav-btn:hover { background: #cbd5e1; }
        .nav-btn.active { background: #0f172a; color: white; }
        
        main { flex: 1; padding: 1.5rem; display: flex; flex-direction: column; overflow: hidden; }
        .iframe-wrapper { flex: 1; background: white; border-radius: 12px; overflow: hidden; border: 1px solid #e2e8f0; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.1); }
        iframe { width: 100%; height: 100%; border: none; }
    </style>
</head>
<body>
    <header>
        <h1>Herramienta para Creación de Planes de Atención de Enfermería</h1>
    </header>
    <nav id="navMenu">
        <button class="nav-btn active" data-tab="gordon">Valoración Gordon</button>
        <button class="nav-btn" data-tab="escalas">Escalas Clínicas</button>
        <button class="nav-btn" data-tab="pae">Plan de Atención</button>
    </nav>
    <main>
        <div class="iframe-wrapper">
            <iframe id="mainFrame" src="1. Patrones de Valoración Gordon.html"></iframe>
        </div>
    </main>
    <script>
        const routes = {
            pae: '3. PAE. HSB.html',
            gordon: '1. Patrones de Valoración Gordon.html',
            escalas: '2. Escalas de Valoración.html'
        };
        const iframe = document.getElementById('mainFrame');
        const buttons = document.querySelectorAll('.nav-btn');
        
        buttons.forEach(btn => {
            btn.addEventListener('click', () => {
                buttons.forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
                iframe.src = routes[btn.dataset.tab];
            });
        });
    </script>
</body>
</html>
